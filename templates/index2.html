<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moodlist</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #400074;
      color: #e8e0d0;
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      overflow: hidden;
      cursor: default;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: 24px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    #wordmark {
      font-family: 'Space Mono', monospace;
      font-size: 24px;
      letter-spacing: 0.18em;
      color: rgba(232,224,208,0.85);
      text-transform: uppercase;
    }

    #auth-btn {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 14px;
      border: 0.5px solid rgba(232,224,208,0.85);
      background: transparent;
      color: rgba(232,224,208,0.75);
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      pointer-events: auto;
      transition: all 0.2s;
    }
    #auth-btn:hover { color: rgba(232,224,208,1); border-color: rgba(232,224,208,0.35); }
    #auth-btn.connected { color: #3ecf72; border-color: rgba(62,207,114,0.4); }

    #hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.15em;
      color: rgba(232,224,208,0.6);
      text-transform: uppercase;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.5s;
    }

    /* ── PLAYLIST VIEW ── */
    #playlist-view {
      position: fixed;
      inset: 0;
      background: #400074;
      z-index: 20;
      display: none;
      flex-direction: column;
      padding: 0 256px 32px 256px;
      overflow-y: auto;
    }
    #playlist-view.visible { display: flex; }

    #playlist-header {
      display: flex;
      flex-direction: column;
      align-items: baseline;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      background: #400074;
      padding-top: 60px;
      padding-bottom: 32px;
      z-index: 2;
    }

    #playlist-mood-title {
      font-family: 'Space Mono', monospace;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    #back-btn {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 16px;
      border: 0.7px solid rgba(232,224,208,0.8);
      background: transparent;
      color: rgba(232,224,208,0.7);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 16px;
    }
    #back-btn:hover { color: #e8e0d0; border-color: rgba(232,224,208,0.5); }

    #status-bar {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: rgba(232,224,208,0.6);
      padding-top: 12px;
      letter-spacing: 0.06em;
    }
    #status-bar.error   { color: #e05c3a; }
    #status-bar.success { color: #3ecf72; }

    #track-list { flex: 1; }

    .track-row {
      display: grid;
      grid-template-columns: 32px 1fr 60px 60px 80px;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 0.5px solid rgba(232,224,208,0.06);
    }

    .track-num {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      color: rgba(232,224,208,0.6);
      text-align: right;
    }

    .track-name   { font-size: 18px; font-weight: 400; color: #e8e0d0; }
    .track-artist { font-size: 13px; color: rgba(232,224,208,0.7); margin-top: 2px; }

    .track-pop, .track-conf {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      color: rgba(232,224,208,0.6);
      text-align: center;
    }

    .badge {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      padding: 3px 7px;
      border-radius: 2px;
      text-transform: uppercase;
      text-align: center;
    }
    .badge-pop { background: rgba(62,207,114,0.1);  color: #3ecf72; border: 0.5px solid rgba(62,207,114,0.2); }
    .badge-ml  { background: rgba(176,124,232,0.1); color: #b07ce8; border: 0.5px solid rgba(176,124,232,0.2); }

    #save-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 32px;
      flex-shrink: 0;
    }

    #save-btn {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 28px;
      background: #e8e0d0;
      color: #080808;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
      align-self: flex-start;
    }
    #save-btn:hover    { background: #fff; }
    #save-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    #save-hint {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: rgba(232,224,208,0.5);
      letter-spacing: 0.04em;
      line-height: 1.7;
    }
    #save-hint a       { color: #3ecf72; text-decoration: none; }
    #save-hint a:hover { text-decoration: underline; }

    .spinner-inline {
      display: inline-block;
      width: 12px; height: 12px;
      border: 1.5px solid rgba(232,224,208,0.2);
      border-top-color: #e8e0d0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="hud">
  <div id="wordmark">Moodlist</div>
  {% if logged_in %}
    <a href="/logout" id="auth-btn" class="connected">● Connected</a>
  {% else %}
    <a href="/login" id="auth-btn">Connect Spotify →</a>
  {% endif %}
</div>

<div id="hint">tap to explore</div>

<canvas id="c"></canvas>

<div id="playlist-view">
  <div id="playlist-header">
    <div style="display:flex; align-items:baseline; justify-content:space-between; width:100%;">
      <div id="playlist-mood-title">—</div>
      <button id="back-btn" onclick="closePlaylist()">← back</button>
    </div>
    <div id="status-bar">—</div>
  </div>

  <div id="track-list"></div>

  <div id="save-row">
    <button id="save-btn" disabled onclick="savePlaylist()">Download Playlist ↓</button>
    <span id="save-hint"></span>
  </div>
</div>

<script>
const IS_LOGGED_IN = {{ 'true' if logged_in else 'false' }};

const MOODS = [
  { id: 'happy',      label: 'Happy',      color: '#CCF368' },
  { id: 'epic',       label: 'Epic',        color: '#F036A4' },
  { id: 'melancholic',label: 'Melancholic', color: '#69A4EA' },
  { id: 'energized',  label: 'Energized',   color: '#FFC864' },
  { id: 'chill',      label: 'Chill',       color: '#02FFFF' },
  { id: 'focused',    label: 'Focus',       color: '#FA7482' },
];

const AMBIENT_COLORS = [
  '#CCF368','#F036A4','#69A4EA','#FFC864','#02FFFF','#FA7482',
  '#ffffff','#b07ce8','#ff6b35','#3ecf72',
];

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W, H, cx, cy;
let exploded  = false;
let bubbles   = [];
let animFrame;
let currentMood   = null;
let currentTracks = [];
let ambientBubbles = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

const orb = { r: 54, pulseAmp: 6, pulseSpeed: 0.045 };

/* ── MOOD BUBBLE ── */
class Bubble {
  constructor(mood, idx, total) {
    const angle = (idx / total) * Math.PI * 2 - Math.PI / 2;
    const dist  = Math.min(W, H) * 0.28;
    this.mood   = mood;
    this.tx     = cx + Math.cos(angle) * dist;
    this.ty     = cy + Math.sin(angle) * dist;
    this.x      = cx;
    this.y      = cy;
    this.vx     = (Math.random() - 0.5) * 4;
    this.vy     = (Math.random() - 0.5) * 4;
    this.r      = 68;
    this.phase  = Math.random() * Math.PI * 2;
    this.driftX = (Math.random() - 0.5) * 0.8;
    this.driftY = (Math.random() - 0.5) * 0.8;
    this.hovered = false;
    this.scale  = 0;
    this.born   = performance.now();
  }

  update(t) {
    const age  = (t - this.born) / 600;
    this.scale = Math.min(1, age * age);
    const spring = 0.08, damp = 0.78;
    this.vx += (this.tx - this.x) * spring;
    this.vy += (this.ty - this.y) * spring;
    this.vx *= damp;
    this.vy *= damp;
    this.x  += this.vx;
    this.y  += this.vy;
    this.tx += this.driftX;
    this.ty += this.driftY;
    const pad = this.r + 20;
    if (this.tx < pad || this.tx > W - pad) this.driftX *= -1;
    if (this.ty < pad || this.ty > H - pad) this.driftY *= -1;
    bubbles.forEach(b => {
      if (b === this) return;
      const dx = this.x - b.x, dy = this.y - b.y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      const min = this.r + b.r + 16;
      if (d < min && d > 0) {
        const f = (min - d) / min * 0.06;
        this.vx += (dx/d)*f;
        this.vy += (dy/d)*f;
      }
    });
  }

  draw(t) {
    const floatY   = Math.sin(this.phase + t * 0.0008) * 5;
    const r        = this.r * this.scale;
    const textSize = this.hovered ? Math.round(r * 0.34) : Math.round(r * 0.28);
    ctx.save();
    ctx.translate(this.x, this.y + floatY);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = this.mood.color;
    ctx.fill();
    ctx.fillStyle    = '#000000';
    ctx.font         = `${textSize}px 'Space Grotesk', sans-serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha  = this.scale;
    ctx.fillText(this.mood.label, 0, 4);
    ctx.restore();
  }

  contains(mx, my) {
    const dx = mx - this.x, dy = my - this.y;
    return Math.sqrt(dx*dx + dy*dy) < this.r * 1.15;
  }
}

/* ── AMBIENT BUBBLE ── */
class AmbientBubble {
  constructor(idx, total) {
    const angle   = (idx / total) * Math.PI * 2 + Math.PI / 6;
    const dist    = Math.min(W, H) * (0.15 + Math.random() * 0.35);
    this.x        = cx;
    this.y        = cy;
    this.tx       = cx + Math.cos(angle) * dist;
    this.ty       = cy + Math.sin(angle) * dist;
    this.vx       = (Math.random() - 0.5) * 4;
    this.vy       = (Math.random() - 0.5) * 4;
    this.r        = 12 + Math.random() * 22;
    this.color    = AMBIENT_COLORS[idx % AMBIENT_COLORS.length];
    this.phase    = Math.random() * Math.PI * 2;
    this.driftX   = (Math.random() - 0.5) * 0.6;
    this.driftY   = (Math.random() - 0.5) * 0.6;
    this.scale    = 0;
    this.born     = performance.now();
    this.opacity  = 0.3 + Math.random() * 0.4;
  }

  update(t) {
    const age  = (t - this.born) / 600;
    this.scale = Math.min(1, age * age);
    const spring = 0.04, damp = 0.82;
    this.vx += (this.tx - this.x) * spring;
    this.vy += (this.ty - this.y) * spring;
    this.vx *= damp;
    this.vy *= damp;
    this.x  += this.vx;
    this.y  += this.vy;
    this.tx += this.driftX;
    this.ty += this.driftY;
    const pad = this.r + 20;
    if (this.tx < pad || this.tx > W - pad) this.driftX *= -1;
    if (this.ty < pad || this.ty > H - pad) this.driftY *= -1;
  }

  draw(t) {
    const floatY = Math.sin(this.phase + t * 0.0008) * 4;
    const r      = this.r * this.scale;
    ctx.save();
    ctx.translate(this.x, this.y + floatY);
    ctx.globalAlpha = 0.4 * this.scale;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.globalAlpha = 0.8 * this.scale;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.strokeStyle = this.color;
    ctx.lineWidth   = 1.2;
    ctx.stroke();
    ctx.restore();
  }
}

/* ── MAIN LOOP ── */
function loop(t) {
  animFrame = requestAnimationFrame(loop);
  ctx.clearRect(0, 0, W, H);

  if (!exploded) {
    const pulse = Math.sin(t * orb.pulseSpeed * 0.1) * orb.pulseAmp;
    const r     = orb.r + pulse;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(232,224,208,0.05)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(232,224,208,0.8)';
    ctx.lineWidth   = 0.8;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r + 14 + pulse * 0.5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(232,224,208,1)';
    ctx.lineWidth   = 0.5;
    ctx.stroke();
    ctx.fillStyle    = 'rgba(232,224,208,1)';
    ctx.font         = '32px serif';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('♪', 0, 2);
    ctx.restore();
    return;
  }

  ambientBubbles.forEach(b => { b.update(t); b.draw(t); });
  bubbles.forEach(b => b.update(t));
  bubbles.forEach(b => b.draw(t));

  const pulse = Math.sin(t * orb.pulseSpeed * 0.1) * (orb.pulseAmp * 0.5);
  const r     = (orb.r * 0.6) + pulse;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(232,224,208,0.12)';
  ctx.lineWidth   = 0.5;
  ctx.stroke();
  ctx.restore();
}

/* ── EXPLODE / COLLAPSE ── */
function explode() {
  if (exploded) return;
  exploded = true;
  document.getElementById('hint').style.opacity = '0';
  bubbles        = MOODS.map((mood, i) => new Bubble(mood, i, MOODS.length));
  ambientBubbles = Array.from({ length: 14 }, (_, i) => new AmbientBubble(i, 14));
  cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(loop);
}

function collapse() {
  exploded       = false;
  bubbles        = [];
  ambientBubbles = [];
  cancelAnimationFrame(animFrame);
  document.getElementById('hint').style.opacity = '1';
  animFrame = requestAnimationFrame(loop);
}

/* ── INPUT ── */
function getPos(e) {
  const r   = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - r.left, y: src.clientY - r.top };
}

canvas.addEventListener('click', e => {
  const { x, y } = getPos(e);
  if (!exploded) {
    const dx = x - cx, dy = y - cy;
    if (Math.sqrt(dx*dx + dy*dy) < orb.r + 20) { explode(); return; }
    return;
  }
  for (const b of bubbles) {
    if (b.contains(x, y)) { triggerMood(b.mood); return; }
  }
  collapse();
});

canvas.addEventListener('mousemove', e => {
  if (!exploded) { canvas.style.cursor = 'pointer'; return; }
  const { x, y } = getPos(e);
  let hit = false;
  bubbles.forEach(b => { b.hovered = b.contains(x, y); if (b.hovered) hit = true; });
  canvas.style.cursor = hit ? 'pointer' : 'default';
});

/* ── PLAYLIST ── */
async function triggerMood(mood) {
  currentMood   = mood;
  currentTracks = [];

  const view     = document.getElementById('playlist-view');
  const title    = document.getElementById('playlist-mood-title');
  const status   = document.getElementById('status-bar');
  const list     = document.getElementById('track-list');
  const saveBtn  = document.getElementById('save-btn');
  const saveHint = document.getElementById('save-hint');

  title.textContent = mood.label;
  title.style.color = mood.color;
  status.className  = '';
  status.innerHTML  = '<span class="spinner-inline"></span>Finding tracks…';
  list.innerHTML    = '';
  saveBtn.disabled  = true;
  saveHint.innerHTML = '';
  view.classList.add('visible');

  try {
    const resp = await fetch(`/generate/${mood.id}?n=25`);
    const data = await resp.json();

    if (!resp.ok) {
      status.className   = 'error';
      status.textContent = data.error || 'Something went wrong.';
      return;
    }

    currentTracks     = data.tracks;
    const cutoff      = Math.ceil(data.tracks.length * 0.8);

    list.innerHTML = `
      <div class="track-row" style="border-bottom:0.5px solid rgba(232,224,208,0.3); margin-bottom:4px;">
        <div></div>
        <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.12em;color:rgba(232,224,208,0.5);text-transform:uppercase;">Track</div>
        <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.12em;color:rgba(232,224,208,0.5);text-transform:uppercase;text-align:center;">Pop</div>
        <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.12em;color:rgba(232,224,208,0.5);text-transform:uppercase;text-align:center;">Conf</div>
        <div></div>
      </div>
      ${data.tracks.map((t, i) => `
        <div class="track-row">
          <div class="track-num">${i + 1}</div>
          <div class="track-info">
            <div class="track-name">${esc(t.track_name || '—')}</div>
            <div class="track-artist">${esc(t.artists ? t.artists.replace(/;/g, ', ') : '—')}</div>
          </div>
          <div class="track-pop">${t.popularity || 0}</div>
          <div class="track-conf">${t.confidence != null ? (t.confidence * 100).toFixed(0) + '%' : '—'}</div>
          <div>${i < cutoff
            ? '<span class="badge badge-pop">Popular</span>'
            : '<span class="badge badge-ml">ML pick</span>'}</div>
        </div>`).join('')}
    `;

    status.className   = 'success';
    status.textContent = `${data.count} tracks · 80% popular · 20% ML pick`;
    saveBtn.disabled   = false;
    saveHint.innerHTML = `Download the .m3u file, then import it into Spotify via
      <a href="https://soundiiz.com" target="_blank" rel="noopener">Soundiiz</a>
      (free) — paste the track list and it creates the Spotify playlist for you.`;

  } catch (err) {
    status.className   = 'error';
    status.textContent = 'Network error: ' + err.message;
  }
}

async function savePlaylist() {
  const saveBtn  = document.getElementById('save-btn');
  const status   = document.getElementById('status-bar');

  saveBtn.disabled = true;
  status.className = '';
  status.innerHTML = '<span class="spinner-inline"></span>Generating file…';

  try {
    const resp = await fetch('/export', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ mood: currentMood.id, tracks: currentTracks }),
    });

    if (!resp.ok) {
      const data = await resp.json();
      status.className   = 'error';
      status.textContent = data.error || 'Export failed.';
      saveBtn.disabled   = false;
      return;
    }

    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `${currentMood.id}_vibes.m3u`;
    a.click();
    URL.revokeObjectURL(url);

    status.className   = 'success';
    status.textContent = `${currentMood.label} playlist downloaded!`;
    saveBtn.disabled   = false;

  } catch (err) {
    status.className   = 'error';
    status.textContent = 'Network error: ' + err.message;
    saveBtn.disabled   = false;
  }
}

function closePlaylist() {
  document.getElementById('playlist-view').classList.remove('visible');
  collapse();
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

animFrame = requestAnimationFrame(loop);
</script>
</body>
</html>
